version: '3.8'

services:
  db:
    image: mysql:8
    container_name: zooshop_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zooshop
    ports:
      - "3307:3306"

  app:
    build: .
    container_name: zooshop_app
    ports:
      - "3000:3000"
    depends_on:
      - db