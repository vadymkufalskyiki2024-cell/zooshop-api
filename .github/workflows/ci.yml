name: CI Pipeline

on:
  push:
    branches: [ main, feature/add-docker ]
  pull_request:
    branches: [ main, feature/add-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install flask mysql-connector-python

    - name: Run test (simple check)
      run: |
        python -c "print('App works')"